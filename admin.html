<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Anydeee Admin — 已停用</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0d0a08; --panel:#1a130e; --line:#2a1f17;
    --text:#f5ede3; --muted:#a39487; --accent:#d97757; --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  body{display:grid;place-items:center;padding:24px}
  main{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .mark{width:44px;height:44px;border-radius:12px;background:rgba(239,68,68,.16);color:var(--red);display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:18px}
  h1{font-size:24px;line-height:1.2;margin:0 0 10px}
  p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 16px}
  a{display:inline-flex;align-items:center;justify-content:center;margin-top:8px;padding:10px 16px;border-radius:9px;background:var(--accent);color:#1a0a02;text-decoration:none;font-weight:800}
  code{background:#100a07;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--text)}
</style>
</head>
<body>
<main>
  <div class="mark">!</div>
  <h1>公開 Demo 已停用管理後台</h1>
  <p>這個部署不再包含前端硬編碼管理員密碼或可操作的後台介面。正式後台應部署在受保護的環境，並由後端驗證登入、角色權限與敏感操作。</p>
  <p>請建立 server-side auth、RBAC、audit log 與 API 權限檢查後，再重新啟用管理功能。</p>
  <a href="/">返回 Anydeee</a>
</main>
</body>
</html>
